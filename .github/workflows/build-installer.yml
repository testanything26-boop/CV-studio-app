name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the uploaded bundle
        run: Expand-Archive -Path "windows-installer-bundle.zip" -DestinationPath "bundle"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Download Python installer (bundled into Setup.exe)
        run: |
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe" `
            -OutFile "bundle/windows-installer/python-3.12.10-amd64.exe"

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "bundle/windows-installer/cv-studio.iss"

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: CVStudio-Windows-Setup
          path: bundle/windows-installer/Output/Setup-CVStudio-*.exe
